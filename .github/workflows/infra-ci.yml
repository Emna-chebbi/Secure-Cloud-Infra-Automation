name: Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'
      - 'docker/**'
  pull_request:
    paths:
      - 'terraform/**'
      - 'ansible/**'
      - 'docker/**'

jobs:
  terraform-validate:
    name: Terraform Format, Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  checkov:
    name: Checkov (Terraform Security Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: true

  trivy-config:
    name: Trivy (IaC Misconfiguration Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform'
          format: 'table'
          exit-code: '0'

  trivy-secrets:
    name: Trivy (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scanners: 'secret'
          format: 'table'
          exit-code: '1'

  trivy-image:
    name: Trivy (Container Image Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t secure-cloud-infra-app:ci -f docker/app/Dockerfile docker/app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secure-cloud-infra-app:ci'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '0'

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: pip install ansible ansible-lint

      - name: Install required collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint playbook.yml
