services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: secure-cloud-infra-app:latest
    container_name: sample-web-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true

